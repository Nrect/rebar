# Скопировано с lifeurok-backend/.golangci.yml и урезано: правила, привязанные
# к каталогам того проекта, здесь не нужны. Планка та же — 0 issues.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true
  sort-order:
    - linter
    - file

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/nrect/rebar

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - nilerr
    - bodyclose
    - gosec
    - sqlclosecheck
    - noctx
    - copyloopvar
    - durationcheck
    - forcetypeassert
    - nilnil
    - rowserrcheck
    - wastedassign
    - intrange
    - makezero
    - mirror
    - revive
    - gocritic
    - unparam
    - unconvert
    - prealloc
    - nolintlint
    - goconst
    - dupl
    - nestif
    - predeclared
    - reassign
    - usestdlibvars
    - perfsprint
    - testifylint
    - sloglint
    - gocyclo
    - gocognit
    - funlen
    - maintidx
    - whitespace
    - tparallel
    - thelper

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: unexported-return
        - name: early-return
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - hugeParam
        - rangeValCopy
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    gosec:
      excludes:
        - G104
      config:
        global:
          audit: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 4
    goconst:
      min-len: 3
      min-occurrences: 3
    dupl:
      threshold: 100
    maintidx:
      under: 20
    perfsprint:
      int-conversion: true
      err-error: false
      errorf: true
      sprintf1: true
      strconcat: false
    testifylint:
      enable-all: true
    sloglint:
      no-mixed-args: true

  exclusions:
    generated: strict
    presets: []
    rules:
      - path: _test\.go
        linters: [errcheck, dupl, funlen, goconst, gocyclo, gocognit, copyloopvar, gosec, noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
