# Скопировано с lifeurok-backend/.golangci.yml и урезано: правила, привязанные
# к каталогам того проекта, здесь не нужны. Планка та же — 0 issues.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true
  sort-order:
    - linter
    - file

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/nrect/rebar

linters:
  enable:
    - govet
    - depguard
    - gomodguard_v2
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - nilerr
    - bodyclose
    - gosec
    - sqlclosecheck
    - noctx
    - copyloopvar
    - durationcheck
    - forcetypeassert
    - nilnil
    - rowserrcheck
    - wastedassign
    - intrange
    - makezero
    - mirror
    - revive
    - gocritic
    - unparam
    - unconvert
    - prealloc
    - nolintlint
    - goconst
    - dupl
    - nestif
    - predeclared
    - reassign
    - usestdlibvars
    - perfsprint
    - testifylint
    - sloglint
    - gocyclo
    - gocognit
    - funlen
    - maintidx
    - whitespace
    - tparallel
    - thelper

  settings:
    # Вторая линия обороны переносимости: importguard_test.go переживает
    # копирование каталога, а этот — ловит раньше, прямо в редакторе.
    # CONVENTIONS §1.
    depguard:
      rules:
        # Драйвер живёт в адаптерах; ядру положен порт Store. Каталоги
        # адаптеров: <pkg>pg, модуль postgres, будущий pglock.
        pgx-only-in-adapters:
          files:
            - "$all"
            - "!$test"
            - "!**/*pg/**"
            - "!**/postgres/**"
            - "!**/pglock/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: "pgx — только в адаптерах (<pkg>pg, postgres, pglock); ядру порт Store"
        # Ядро метрик не пишет: наблюдаемость — декоратор или порт Observer
        # в <pkg>otel. CONVENTIONS §6.
        otel-only-in-adapters:
          files:
            - "$all"
            - "!$test"
            - "!**/*otel/**"
            - "!**/otelboot/**"
            - "!**/errtrack/**"
          deny:
            - pkg: go.opentelemetry.io
              desc: "otel — только в <pkg>otel, otelboot, errtrack; ядру порт Observer или декоратор"
    # Библиотеки, которых в тулките не будет: замена есть, а разнобой в
    # одиннадцати модулях стоит дороже привычки.
    gomodguard_v2:
      blocked:
        - module: github.com/lib/pq
          reason: "database/sql-драйвер без поддержки; адаптеры на pgx/v5"
          recommendations:
            - github.com/jackc/pgx/v5
        - module: github.com/sirupsen/logrus
          reason: "логирование — log/slog stdlib; порт логгера у потребителя"
          recommendations:
            - log/slog
        - module: github.com/pkg/errors
          reason: "обёртки и Is/As — stdlib errors с %w; errorlint следит за приведением"
          recommendations:
            - errors
        - module: github.com/golang/mock
          reason: "заброшен, и моков в тулките нет: порты проверяются двойниками в <pkg>test (CONVENTIONS §3)"
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: unexported-return
        - name: early-return
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - hugeParam
        - rangeValCopy
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    gosec:
      excludes:
        - G104
      config:
        global:
          audit: true
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 4
    goconst:
      min-len: 3
      min-occurrences: 3
    dupl:
      threshold: 100
    maintidx:
      under: 20
    perfsprint:
      int-conversion: true
      err-error: false
      errorf: true
      sprintf1: true
      strconcat: false
    testifylint:
      enable-all: true
    sloglint:
      no-mixed-args: true

  exclusions:
    generated: strict
    presets: []
    rules:
      - path: _test\.go
        linters: [errcheck, dupl, funlen, goconst, gocyclo, gocognit, copyloopvar, gosec, noctx]

issues:
  # По умолчанию golangci-lint оставляет одну находку на строку, и находка
  # линтера-стража молча проигрывает соседней: на `_ "github.com/jackc/pgx/v5"`
  # в ядре побеждает revive с blank-imports, а запрет depguard исчезает. Страж,
  # который молчит, хуже отсутствующего, поэтому склейка по строке выключена.
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
