name: CI

# Репозиторий многомодульный. Каждый модуль гоняется ОТДЕЛЬНО и БЕЗ go.work:
# так его увидит потребитель, и зависимость, случайно подтянутая из соседнего
# модуля через workspace, упадёт здесь, а не у него.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  modules:
    name: Discover modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      # fetch-depth: 0 — иначе не с чем сравнивать PR: origin/<base> недоступен.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # На PR гоняются только тронутые модули: одиннадцать модулей × три джоба —
      # 33 ожидания ради правки в одном каталоге. Правка корневого файла
      # (конфиг линтера, go.work, Makefile, workflow) касается всех, поэтому
      # возвращает полный список. На main и по кнопке — всегда полный.
      - id: find
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          all=$(find . -name go.mod -not -path './.git/*' -not -path './.claude/*' -exec dirname {} \; | sort)
          selected="$all"
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
            echo "changed files:"; echo "$changed" | sed 's/^/  /'
            if echo "$changed" | grep -qE '^(\.golangci\.yml|go\.work|Makefile|\.github/)'; then
              echo "тронут корневой файл — полный список модулей"
            else
              selected=$(printf '%s\n' "$all" | while IFS= read -r m; do
                prefix="${m#./}/"
                if printf '%s\n' "$changed" | awk -v p="$prefix" 'index($0, p) == 1 { hit = 1 } END { exit !hit }'; then
                  printf '%s\n' "$m"
                fi
              done)
            fi
          fi
          list=$(echo "$selected" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "modules: $list"

  lint:
    name: Lint (${{ matrix.module }})
    needs: modules
    if: needs.modules.outputs.list != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --timeout=5m --config=${{ github.workspace }}/.golangci.yml

  test:
    name: Tests, race (${{ matrix.module }})
    needs: modules
    if: needs.modules.outputs.list != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      # Интеграционные тесты (testcontainers: Mailpit, Postgres) идут здесь же:
      # у ubuntu-latest есть Docker. Без него адаптеры проверялись бы только
      # двойниками, то есть контракт атомарности — никем.
      # Пояс не UTC, с получасовым смещением и летним временем: код, тайком
      # зависящий от пояса машины, падает здесь (docs/CORRECTNESS.md, §8).
      - name: go test -race
        working-directory: ${{ matrix.module }}
        env:
          TZ: America/St_Johns
        run: go test ./... -race -count=1 -coverprofile=cover.out -covermode=atomic -timeout=600s

  govulncheck:
    name: Vuln scan (${{ matrix.module }})
    needs: modules
    if: needs.modules.outputs.list != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lockstep:
    name: Lockstep (go, toolchain, общие зависимости)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: go и toolchain одинаковые во всех go.mod
        run: ./scripts/toolchain-lockstep.sh
      - name: общие зависимости одной версии
        run: ./scripts/deps-lockstep.sh

  # Стражи правил репозитория: время, текст и живая схема, границы процесса,
  # цепочка поставки CI. Исключения каждого — scripts/<страж>.allow с причиной.
  guards:
    name: Стражи правил (время, миграции, границы процесса, CI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: время — UTC и параметром
        run: ./scripts/timeguard.sh
      - name: миграции — COLLATE "C", lock_timeout, схема на живой базе
        run: ./scripts/sqlguard.sh
      - name: границы процесса — таймауты, потолки, горутины
        run: ./scripts/codeguard.sh
      - name: CI — действия по SHA, permissions, регистр путей
        run: ./scripts/ciguard.sh

  # Секреты в дереве: pre-commit хук стоит не у всех, а репозиторий публичный.
  # Исключения — точные тестовые значения в .gitleaks.toml.
  secrets:
    name: Секреты в дереве (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gitleaks по рабочему дереву
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  # Пример — гейт тегов: модуль, который не собирается вместе с соседями,
  # тега не получает. На PR не гоняется (каталог трогают редко), на main и по
  # кнопке — обязателен.
  examples:
    name: Examples build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: go build examples
        run: |
          if [ ! -d examples ]; then
            echo "examples/ ещё нет — шаг пропущен"
            exit 0
          fi
          for m in examples/*/; do
            [ -f "$m/go.mod" ] || continue
            echo "== $m"
            (cd "$m" && go build ./...)
          done
