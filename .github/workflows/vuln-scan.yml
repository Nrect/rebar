name: Weekly vuln scan

# CVE в go-mail, pgx или x/crypto появится без нашего пуша. Еженедельный прогон
# по main — единственный способ узнать об этом раньше потребителей.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  GOWORK: off

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck (all modules)
        run: |
          for m in $(find . -name go.mod -not -path './.git/*' -exec dirname {} \; | sort); do
            echo "== $m"
            (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...) || exit 1
          done
