# Скан секретов (SECURITY.md, «Что сканируется»): правила gitleaks по умолчанию
# и исключения по точным значениям — публичным тестовым, не секретам.
#
# Исключение по путям здесь не годится: файл, попавший под paths, gitleaks
# пропускает целиком, и настоящий токен в _test.go ушёл бы в репозиторий.
[extend]
useDefault = true

[[allowlists]]
description = "Тестовые значения: пароль стенда монолита, маркер теста утечки, эталонный ключ imgproxy из его документации, хост в тесте конфига otelboot"
# Сравнение — со всем совпадением: секретом правило generic считает хвост строки.
regexTarget = "match"
regexes = [
  '''q7-Lagoon-Quartz-Marmot-91''',
  '''SECRET-7f3a-body''',
  '''943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881''',
  '''secret-host\.internal''',
]
